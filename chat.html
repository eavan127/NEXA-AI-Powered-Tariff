<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA · AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/tabler-icons.min.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/redesign.css">
</head>
<body data-page="chat">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <div class="topbar"></div>
    <div class="content">

      <div class="lookup-head">
        <div>
          <h1>AI Assistant</h1>
          <p>Ask about FTA duty savings, landed cost, or a savings forecast — answers cite their sources.</p>
        </div>
        <div class="lookup-head-actions">
          <div class="chat-role" id="chatRole">
            <button class="chat-role-btn" data-role="analyst">Analyst</button>
            <button class="chat-role-btn" data-role="manager">Manager</button>
          </div>
        </div>
      </div>

      <section class="chat-section">
        <div class="chat-stream" id="chatStream"></div>
        <div class="chat-quick" id="chatQuick"></div>
        <form class="chat-inputbar" id="chatForm" autocomplete="off">
          <input id="chatInput" type="text" placeholder="Ask about savings, landed cost, or a forecast…">
          <button type="submit" class="btn btn-primary" id="chatSend">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>
            Send
          </button>
        </form>
      </section>

    </div>
  </div>
</div>

<div id="toast" class="toast"><span id="toastMsg"></span></div>

<script src="js/shared.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/chat-page.js"></script>
</body>
</html>
